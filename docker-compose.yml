services:
  atelie:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    env_file: .env.production   # MUAPI_API_KEY, SUPABASE_SECRET_KEY, MUAPI_ENV=production ...
    ports: ["127.0.0.1:3000:3000"]   # exponha só via Nginx/Caddy com HTTPS
    restart: unless-stopped
